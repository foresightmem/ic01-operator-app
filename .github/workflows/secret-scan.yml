name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - security-rls-remediation

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan high-risk secret patterns
        run: bash tooling/secret_scan.sh
